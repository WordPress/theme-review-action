name: 'WordPress Theme Check Action'
description: 'Runs the Theme Check plugin against your theme'
author: 'The WordPress Contributors'
inputs:
  root-folder:
    description: 'The location of your theme'
    default: .
  accessible-ready:
    description: 'Whether to run the full accessibility tests'
    default: false
  ui-debug:
    description: 'More verbose logging; Creates a GIF'
    default: false
outputs:
  ui-check-output:
    description: "Debug output from ui check"
    value: ${{ steps.post.outputs.ui-check-output}}
  logs:
    description: "Path to the logs"
    value: ${{ steps.post.outputs.logs}}
branding:
  icon: 'clipboard'  
  color: 'blue'
runs:
  using: 'composite'
  steps:
    - run: |
        echo Copying theme folder ...
        rsync -av --exclude=.git* ${{ inputs.root-folder }}/* ${{ github.action_path }}/test-theme
      shell: bash

    - run: |
        cd ${{ github.action_path }} && npm install
        cd ${{ github.action_path }} && node bin/github.js
        # The container reads these as a different user, and rsync preserves
        # whatever modes the theme arrived with, so grant read explicitly.
        cd ${{ github.action_path }} && chmod -R a+rX ./test-theme ./helpers ./config ./actions/theme-check
        # Every mapped directory is writable from inside the container: wp-env bind-mounts them
        # read/write and runs as this user. logs/theme-check/ is the only one written on purpose.
        cd ${{ github.action_path }} && mkdir -p ./logs/theme-check && chmod -R a+rwX ./logs/theme-check
      id: post
      shell: bash

    - run: cd ${{ github.action_path }} && npm run start -- --skipFolderCopy --githubRun --accessibleReady=${{ inputs.accessible-ready }} --debug --UIDebug
      shell: bash
